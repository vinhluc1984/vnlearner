<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF4500">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vnLearner - Mythical Hatchery</title>
    <style>
        :root {
            --primary: #FF4500;
            --secondary: #FFD700;
            --accent: #4CAF50;
            --text: #333;
            --bg: #FFF9E6;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: var(--text);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .container {
            background: white; padding: 1.5rem; border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid var(--secondary);
            text-align: center; max-width: 500px; width: 95%;
            position: relative; height: 90vh;
            display: flex; flex-direction: column;
        }

        .screen { display: none; flex-grow: 1; overflow-y: auto; padding: 5px; }
        .active { display: block; }

        .btn { padding: 0.8rem 1.2rem; font-size: 1.1rem; border: none; border-radius: 50px; cursor: pointer; transition: transform 0.2s; font-weight: bold; margin: 5px; }
        .btn:hover { transform: scale(1.05); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--secondary); color: #333; }
        .btn-back { background: none; border: 2px solid var(--primary); color: var(--primary); width: 40px; height: 40px; border-radius: 50%; position: absolute; top: 10px; left: 10px; z-index: 100; cursor: pointer; }

        .top-bar { position: absolute; top: 15px; right: 15px; font-weight: bold; color: var(--primary); z-index: 10; display: flex; gap: 10px; }

        /* --- MONSTER & EGG DISPLAY --- */
        .monster-display {
            width: 220px; height: 260px;
            margin: 15px auto; position: relative;
            background: #fdfdfd; border-radius: 20px; border: 3px dashed #ddd;
            display: flex; align-items: center; justify-content: center;
            overflow: visible;
        }

        .char-part { position: absolute; left: 50%; transform: translateX(-50%); line-height: 1; pointer-events: none; }
        .char-head { top: 60px; font-size: 7rem; z-index: 5; transition: transform 0.3s; }
        .char-acc { top: 35px; font-size: 3.5rem; z-index: 10; }
        .char-skill-effect { top: 20px; font-size: 4rem; z-index: 12; opacity: 0; transition: opacity 0.3s; }

        /* --- EGG PROGRESS BAR --- */
        .progress-box { width: 80%; margin: 10px auto; background: #eee; border-radius: 20px; height: 25px; overflow: hidden; border: 2px solid #ccc; position: relative; }
        .progress-bar { background: var(--accent); height: 100%; width: 0%; transition: width 0.4s ease-in-out; }
        .progress-text { position: absolute; width: 100%; top: 2px; left: 0; font-size: 0.85rem; font-weight: bold; color: #333; }

        /* --- INVENTORY & SKILL CARDS --- */
        .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .card { background: #fff; border: 2px solid #ddd; border-radius: 15px; padding: 10px; cursor: pointer; transition: all 0.2s; }
        .card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .card.active-card { border-color: var(--accent); background: #e8f5e9; }

        /* --- ANIMATION CLASSES FOR SKILLS --- */
        @keyframes animFly {
            0% { transform: translateX(-50%) translateY(0px); }
            50% { transform: translateX(-50%) translateY(-35px); }
            100% { transform: translateX(-50%) translateY(0px); }
        }
        @keyframes animBicycle {
            0% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-40%) rotate(5deg); }
            75% { transform: translateX(-60%) rotate(-5deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }
        @keyframes animFire {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.2); filter: drop-shadow(0 0 15px red); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .anim-flying { animation: animFly 1.5s infinite ease-in-out; }
        .anim-bicycle { animation: animBicycle 1s infinite linear; }
        .anim-fire { animation: animFire 0.8s infinite ease-in-out; }

        /* VOCAB GRID */
        .learn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .learn-card { background: #f9f9f9; border: 2px dashed #ccc; border-radius: 15px; padding: 10px; cursor: pointer; }
        .revealed { border-style: solid; border-color: var(--secondary); background: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <span>⭐ <span id="xp-val">0</span>/100 XP</span>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="home-screen" class="screen active">
        <h1 style="color:var(--primary); margin-top:30px; margin-bottom:5px;">Mythical Hatchery</h1>
        <p id="monster-status-title" style="margin:0; font-weight:bold;">Your Egg is Growing!</p>

        <div class="monster-display">
            <span id="char-skill-effect" class="char-part char-skill-effect"></span>
            <span id="char-acc" class="char-part char-acc"></span>
            <span id="char-head" class="char-part char-head">🥚</span>
        </div>

        <div class="progress-box">
            <div id="progress-bar" class="progress-bar"></div>
            <div id="progress-text" class="progress-text">0 / 100 XP to Hatch</div>
        </div>

        <div style="margin-top:15px; display:flex; flex-direction:column; gap:8px; align-items:center;">
            <button class="btn btn-primary" style="width:85%" onclick="startVocabSession()">📕 Study & Hatch Egg (+10 XP)</button>
            <button class="btn btn-secondary" style="width:85%" onclick="showScreen('skills-screen')">📜 Skill & Accessories Book</button>
        </div>
    </div>

    <!-- SKILLS & ACCESSORIES SCREEN -->
    <div id="skills-screen" class="screen">
        <button class="btn btn-back" onclick="showScreen('home-screen')">⬅</button>
        <h2 style="margin-top:40px; color:var(--primary);">Skill & Accessory Book</h2>
        <p><small>Tap unlocked cards to perform action or wear item!</small></p>

        <h3>✨ Unlocked Skills</h3>
        <div id="skills-container" class="card-grid"></div>

        <h3>👑 Accessories</h3>
        <div id="acc-container" class="card-grid"></div>
    </div>

    <!-- VOCAB STUDY SCREEN -->
    <div id="learn-screen" class="screen">
        <h2 style="color:var(--primary);">Learn Vocabulary</h2>
        <p>Tap cards to reveal Vietnamese words!</p>
        <div id="learn-grid" class="learn-grid"></div>
        <button id="next-quiz-btn" class="btn btn-primary" style="display:none; margin-top:15px;" onclick="startVocabQuiz()">📝 Take Quiz for Reward!</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="screen">
        <h2 style="color:var(--primary);">Vocabulary Quiz</h2>
        <div id="quiz-emoji" style="font-size:5rem; margin:10px;"></div>
        <div id="quiz-options" style="display:flex; flex-direction:column; gap:10px; align-items:center;"></div>
        <h3 id="quiz-msg" style="margin-top:15px; color:var(--accent);"></h3>
    </div>
</div>

<script>
    // Vocabulary Data
    const vocabData = [
        { word: 'Mèo', en: 'Cat', emoji: '🐱' },
        { word: 'Rồng', en: 'Dragon', emoji: '🐲' },
        { word: 'Táo', en: 'Apple', emoji: '🍎' },
        { word: 'Xe đạp', en: 'Bicycle', emoji: '🚲' },
        { word: 'Lửa', en: 'Fire', emoji: '🔥' },
        { word: 'Bay', en: 'Fly', emoji: '✈️' }
    ];

    // Skill & Accessory Definitions
    const skillList = [
        { id: 'fly', name: 'Flying', emoji: '✈️', anim: 'anim-flying', type: 'skill' },
        { id: 'bicycle', name: 'Riding Bike', emoji: '🚲', anim: 'anim-bicycle', type: 'skill' },
        { id: 'fire', name: 'Fire Breathing', emoji: '🔥', anim: 'anim-fire', type: 'skill' }
    ];

    const accList = [
        { id: 'crown', name: 'Crown', emoji: '👑', type: 'acc' },
        { id: 'glasses', name: 'Sunglasses', emoji: '🕶️', type: 'acc' },
        { id: 'bow', name: 'Ribbon', emoji: '🎀', type: 'acc' }
    ];

    // Player State
    let xp = parseInt(localStorage.getItem('monster_xp')) || 0;
    let isHatched = localStorage.getItem('monster_hatched') === 'true';
    let unlockedCards = JSON.parse(localStorage.getItem('monster_cards')) || [];
    let activeSkill = localStorage.getItem('monster_active_skill') || null;
    let activeAcc = localStorage.getItem('monster_active_acc') || null;

    function saveState() {
        localStorage.setItem('monster_xp', xp);
        localStorage.setItem('monster_hatched', isHatched);
        localStorage.setItem('monster_cards', JSON.stringify(unlockedCards));
        if(activeSkill) localStorage.setItem('monster_active_skill', activeSkill);
        else localStorage.removeItem('monster_active_skill');
        if(activeAcc) localStorage.setItem('monster_active_acc', activeAcc);
        else localStorage.removeItem('monster_active_acc');
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        updateUI();
    }

    function updateUI() {
        // Update XP Bar
        const displayXp = Math.min(xp, 100);
        document.getElementById('xp-val').innerText = displayXp;
        document.getElementById('progress-bar').style.width = displayXp + '%';

        const headEl = document.getElementById('char-head');
        const accEl = document.getElementById('char-acc');
        const skillEffectEl = document.getElementById('char-skill-effect');
        const titleEl = document.getElementById('monster-status-title');

        if (!isHatched) {
            headEl.innerText = '🥚';
            titleEl.innerText = 'Egg Progress: ' + displayXp + '/100 XP';
            document.getElementById('progress-text').innerText = displayXp + ' / 100 XP to Hatch';
        } else {
            headEl.innerText = '🐲'; // Hatched Cute Dragon!
            titleEl.innerText = 'Your Mythical Dragon!';
            document.getElementById('progress-text').innerText = 'Hatched & Fully Evolved! 🎉';
        }

        // Apply Accessories
        accEl.innerText = activeAcc ? (accList.find(a => a.id === activeAcc)?.emoji || '') : '';

        // Apply Animations & Skill Effects
        headEl.className = 'char-part char-head';
        skillEffectEl.style.opacity = '0';

        if (activeSkill) {
            const skillObj = skillList.find(s => s.id === activeSkill);
            if (skillObj) {
                headEl.classList.add(skillObj.anim);
                skillEffectEl.innerText = skillObj.emoji;
                skillEffectEl.style.opacity = '1';
            }
        }

        renderCards();
    }

    function renderCards() {
        const skillsContainer = document.getElementById('skills-container');
        const accContainer = document.getElementById('acc-container');
        skillsContainer.innerHTML = ''; accContainer.innerHTML = '';

        skillList.forEach(s => {
            const owned = unlockedCards.includes(s.id);
            const card = document.createElement('div');
            card.className = `card ${activeSkill === s.id ? 'active-card' : ''}`;
            card.style.opacity = owned ? '1' : '0.4';
            card.innerHTML = `<span style="font-size:2rem">${s.emoji}</span><br><b>${s.name}</b><br><small>${owned ? (activeSkill === s.id ? 'Active' : 'Perform') : 'Locked'}</small>`;
            
            if(owned) {
                card.onclick = () => {
                    activeSkill = (activeSkill === s.id) ? null : s.id;
                    saveState(); updateUI();
                };
            }
            skillsContainer.appendChild(card);
        });

        accList.forEach(a => {
            const owned = unlockedCards.includes(a.id);
            const card = document.createElement('div');
            card.className = `card ${activeAcc === a.id ? 'active-card' : ''}`;
            card.style.opacity = owned ? '1' : '0.4';
            card.innerHTML = `<span style="font-size:2rem">${a.emoji}</span><br><b>${a.name}</b><br><small>${owned ? (activeAcc === a.id ? 'Equipped' : 'Wear') : 'Locked'}</small>`;
            
            if(owned) {
                card.onclick = () => {
                    activeAcc = (activeAcc === a.id) ? null : a.id;
                    saveState(); updateUI();
                };
            }
            accContainer.appendChild(card);
        });
    }

    // --- VOCABULARY & REWARD LOGIC ---
    let currentSession = [];
    function startVocabSession() {
        showScreen('learn-screen');
        currentSession = vocabData.sort(() => 0.5 - Math.random()).slice(0, 3);
        const grid = document.getElementById('learn-grid'); grid.innerHTML = '';
        let revealedCount = 0;

        currentSession.forEach(item => {
            const card = document.createElement('div');
            card.className = 'learn-card';
            card.innerHTML = `<span style="font-size:2.5rem">${item.emoji}</span><p style="margin:5px 0;"><b>${item.word}</b></p>`;
            card.onclick = () => {
                if(!card.classList.contains('revealed')) {
                    card.classList.add('revealed');
                    revealedCount++;
                    if(revealedCount === currentSession.length) {
                        document.getElementById('next-quiz-btn').style.display = 'block';
                    }
                }
            };
            grid.appendChild(card);
        });
    }

    function startVocabQuiz() {
        showScreen('quiz-screen');
        const target = currentSession[Math.floor(Math.random() * currentSession.length)];
        document.getElementById('quiz-emoji').innerText = target.emoji;
        document.getElementById('quiz-msg').innerText = '';

        const options = document.getElementById('quiz-options'); options.innerHTML = '';
        currentSession.forEach(o => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-primary'; btn.style.width = '80%';
            btn.innerText = o.word;
            btn.onclick = () => {
                if(o === target) {
                    processQuizReward();
                } else {
                    document.getElementById('quiz-msg').innerText = '❌ Thử lại! (Try again!)';
                }
            };
            options.appendChild(btn);
        });
    }

    function processQuizReward() {
        // Award XP
        xp += 10;
        if (xp >= 100 && !isHatched) {
            isHatched = true;
            alert('🎉 Congratulations! Your Mythical Monster Egg hatched into a Cute Dragon! 🐲');
        }

        // Random Loot Drop (XP, Skill, or Accessory)
        const lootPool = [...skillList, ...accList].filter(item => !unlockedCards.includes(item.id));
        let rewardText = '+10 XP Gained!';

        if (lootPool.length > 0 && Math.random() < 0.6) { // 60% chance to drop new item card
            const reward = lootPool[Math.floor(Math.random() * lootPool.length)];
            unlockedCards.push(reward.id);
            rewardText = `🎉 +10 XP & Unlocked: ${reward.emoji} ${reward.name}!`;
        }

        saveState();
        document.getElementById('quiz-msg').innerText = rewardText;
        setTimeout(() => showScreen('home-screen'), 1800);
    }

    updateUI();
</script>
</body>
</html>
